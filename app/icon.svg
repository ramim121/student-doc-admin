<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="StudyDock Admin">
  <!--
    Same StudyDock mark as the portal, in the admin console's own gradient
    (indigo-600 to purple-600, matching the sidebar tile). Identical icons on
    both apps would be indistinguishable in a tab strip, and these two are
    normally open side by side.
  -->
